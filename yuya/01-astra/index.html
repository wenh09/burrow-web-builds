<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="沿着亮灯的食街走过红桥，进入汤屋前厅。一个可以自由行走的三维世界片段。">
<link rel="icon" href="data:,"><title>汤屋 · 入夜之前</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17282b;color:#fff0d5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}canvas{display:block;width:100%;height:100%;outline:0}#entry{position:fixed;inset:0;background:linear-gradient(90deg,#102127e8,#10212762 60%,#10212718),url('poster.png') center/cover;display:flex;align-items:center;padding:8vw}.intro{max-width:400px}h1{font:500 clamp(62px,8vw,104px)/1.2 "Songti SC",serif;letter-spacing:.18em;margin:0 0 12px}.subtitle{letter-spacing:.45em;font-size:21px;margin-bottom:34px}.description{font-size:15px;line-height:1.9;color:#dadbd0;margin-bottom:30px}button{font:inherit;font-size:17px;border:1px solid #d9c494;color:#243537;background:#edd6a7;padding:14px 26px;border-radius:2px;cursor:pointer}button:hover{background:#ffebc1}button:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;line-height:1.8;color:#bdccc9;margin-top:20px}#status{font-size:13px;line-height:1.7;color:#f5dfb7;min-height:24px;margin-top:14px}progress{accent-color:#edcb8d;width:270px;height:4px;display:none}#pointer{display:none;position:fixed;bottom:28px;right:28px;color:#f3e7d4;font-size:13px;background:#1a303bdd;padding:10px 14px;pointer-events:none}#full{display:none;position:fixed;right:22px;top:22px;font-size:12px;padding:8px 12px;background:#14282b88;color:#f7e7c9;border-color:#e2d0a633}@media(max-width:600px){#entry{padding:28px}.intro{max-width:320px}h1{font-size:64px}}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="汤屋与街道三维探索"></canvas>
<main id="entry"><div class="intro"><h1>汤屋</h1><div class="subtitle">入夜之前</div><p class="description">食铺的灯亮起来了。<br>沿着神隐街道，走过红桥，到汤屋门前。</p><button id="start">走进街道 →</button><p class="hint">电脑键盘和鼠标体验<br>WASD 行走 · Shift 快走 · 鼠标环视</p><progress id="progress" max="100" value="0"></progress><div id="status" role="status"></div></div></main>
<div id="pointer">按住鼠标左键拖动环视</div><button id="full">全屏</button>
<script src="game.js"></script>
<script>
const config={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":6172048,"game.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4},canvas=document.querySelector('#canvas');config.canvasResizePolicy=0;
function resize(){const scale=Math.min(1,1440/innerWidth,900/innerHeight);canvas.width=Math.round(innerWidth*scale);canvas.height=Math.round(innerHeight*scale)}resize();addEventListener('resize',resize);
const engine=new Engine(config),button=document.querySelector('#start'),status=document.querySelector('#status'),progress=document.querySelector('#progress');window.worldErrors=[];
const realFetch=fetch.bind(window);
async function transport(){const response=await realFetch('./packed-files.json');if(!response.ok)throw Error('场景清单加载失败');const manifest=await response.json();if(!('DecompressionStream' in window))throw Error('请使用支持 WebGL 2 的新版浏览器');window.fetch=async(input,init)=>{const url=new URL(typeof input==='string'?input:input.url,location.href),asset=url.origin===location.origin&&manifest[url.pathname.split('/').pop()];if(!asset)return realFetch(input,init);const packed=await realFetch(new URL(asset.file,url),init);if(!packed.ok)throw Error('场景文件加载失败');return new Response(packed.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':asset.mime,'Content-Length':String(asset.size)}})}}
button.addEventListener('click',async()=>{button.disabled=true;button.textContent='正在打开…';progress.style.display='block';try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw Error('浏览器缺少 '+missing.join('、'));await transport();await engine.startGame({args:['--','--enter'],onProgress(a,b){if(b){progress.value=a/b*100;status.textContent='正在加载场景 · '+Math.round(a/b*100)+'%'}},onPrintError(...args){window.worldErrors.push(args.join(' '));console.error(...args)}});const began=performance.now();await new Promise((resolve,reject)=>{const check=setInterval(()=>{if(window.worldStatus?.ready){clearInterval(check);resolve()}else if(performance.now()-began>60000){clearInterval(check);reject(Error('场景初始化超时'))}},100)});document.querySelector('#entry').remove();document.querySelector('#full').style.display='block';canvas.focus()}catch(error){window.worldErrors.push(String(error));status.textContent=error.message;button.disabled=false;button.textContent='刷新重试';button.onclick=()=>location.reload()}});
document.addEventListener('pointerlockerror',()=>{document.querySelector('#pointer').style.display='block';setTimeout(()=>document.querySelector('#pointer').style.display='none',7000)});
document.querySelector('#full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();canvas.focus()}catch{}});
</script></body></html>
