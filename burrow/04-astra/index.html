<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26372e"><meta name="description" content="从院子走进陋居，循木楼梯探访五层家屋。"><title>陋居 · Hearth</title><link rel="icon" href="data:,">
<style>
:root{--ink:#26372e;--paper:#f3e6c6;--gold:#eac57b;--line:#e8d4a65e;--back:#26372eee;--muted:#c6cbbb}*{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#344f47;color:var(--paper);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer;color:var(--paper);background:var(--back);border:1px solid var(--line);border-radius:4px;padding:10px 15px;font-size:14px;transition:background .18s}button:hover{background:#435845}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}button.primary:hover{background:#ffe4a9}#canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:flex;align-items:end;background:linear-gradient(0deg,#1b302ce8,transparent 90%),url('./poster.png') center/cover;padding:6vw;z-index:10}#loading h1{font-family:"Songti SC",serif;font-size:60px;font-weight:500;letter-spacing:.20em;margin:0 0 10px}#loading small{font-size:13px;letter-spacing:.3em;color:var(--gold)}#loading p{font-size:16px;line-height:1.8}#loading progress{appearance:none;width:min(340px,80vw);height:3px;background:#ffffff22;border:0;display:block;margin-top:24px}progress::-webkit-progress-bar{background:#ffffff22}progress::-webkit-progress-value{background:var(--gold)}#status{font-size:14px;min-height:23px;color:var(--muted)}#hud{position:fixed;inset:0;pointer-events:none;z-index:2;text-shadow:0 2px 7px #223128aa}.brand{position:absolute;left:30px;top:27px;display:flex;gap:13px;align-items:center}.brand strong{font:500 31px "Songti SC",serif;letter-spacing:.16em}.brand span{font-size:12px;letter-spacing:.22em;border-left:1px solid var(--gold);padding-left:14px;color:var(--paper)}.location{position:absolute;right:30px;top:27px;border-top:1px solid var(--gold);padding-top:10px;font-size:14px;letter-spacing:.08em}.footer{position:absolute;left:30px;bottom:27px;font-size:14px;color:var(--paper);display:flex;gap:15px;align-items:center}.footer kbd{font:12px inherit;padding:3px 5px;border:1px solid #f4eaca88;border-radius:3px;background:#26372e99}.dot{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#ffefd8b0}.toolbar{position:fixed;right:27px;bottom:23px;display:flex;gap:9px;z-index:3}.toolbar button{backdrop-filter:blur(9px)}#tour-entry{position:absolute;left:30px;bottom:74px;pointer-events:auto;min-width:148px;padding:13px 22px}#hint{position:fixed;left:50%;top:82%;transform:translateX(-50%);padding:10px 15px;border-left:2px solid var(--gold);background:var(--back);font-size:14px;z-index:5;pointer-events:none}dialog{background:var(--back);color:var(--paper);border:1px solid var(--line);border-radius:7px;width:min(500px,calc(100vw - 30px));padding:28px;box-shadow:0 24px 100px #13271c80}dialog::backdrop{background:#122e2575;backdrop-filter:blur(5px)}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}dialog h2{font:500 25px "Songti SC",serif;margin:0}dialog h3{font-size:15px;font-weight:500;color:var(--gold);margin:22px 0 12px}dialog .close{border:0;background:none;padding:0 8px;font-size:27px}dialog p{font-size:14px;line-height:1.8;color:var(--muted)}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e8d4a61f;font-size:14px}.places{display:grid;grid-template-columns:1fr 1fr;gap:9px}.places button{text-align:left;padding:12px}.places small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.quality{background:var(--ink);color:var(--paper);border:1px solid var(--line);padding:6px;font-size:14px}.wide{width:100%;margin-top:20px}#metrics{position:fixed;left:30px;top:81px;z-index:4;font-size:12px;background:#24382baa;padding:5px 9px;pointer-events:none}#touch{position:fixed;bottom:85px;left:25px;z-index:4;display:none;gap:5px;grid-template-columns:repeat(3,42px)}#touch button{padding:10px;font-size:17px;touch-action:none}#touch button:first-child{grid-column:2}#touch button:nth-child(2){grid-column:1}@media(pointer:coarse){#touch{display:grid}.footer{display:none}}@media(max-width:680px){.brand{left:20px;top:20px}.brand strong{font-size:26px}.brand span{display:none}.location{right:20px;top:20px;font-size:13px}.toolbar{right:18px;bottom:19px;gap:5px}.toolbar button{padding:9px 11px;font-size:13px}.footer{left:20px;bottom:72px;font-size:13px}.footer .secondary{display:none}#tour-entry{left:20px;bottom:113px}#loading{padding:30px}#loading h1{font-size:46px}#hint{top:70%;max-width:88%;width:max-content}}@media(prefers-reduced-motion:reduce){*{transition:none}}
</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="陋居三维探索场景"></canvas>
<div id="loading"><div><small>THE BURROW · HEARTH</small><h1>陋居</h1><p>炉火未熄，屋里还有人等你。</p><button class="primary" id="start">打开陋居</button><progress id="progress" max="100" value="0" hidden aria-label="场景加载进度"></progress><p id="status" role="status">可自由探索的室内外场景 · 本地运行</p></div></div>
<div id="hud" hidden><div class="brand"><strong>陋居</strong><span>HEARTH</span></div><div class="location" id="location">陋居全景</div><div class="dot" id="dot" hidden></div><button class="primary" id="tour-entry">走进屋里 ↗</button><div class="footer" id="controls"><span>拖动环视</span><span class="secondary">滚轮远近</span></div></div>
<div class="toolbar" id="toolbar" hidden><button id="overview">全景</button><button id="places">去往…</button><button id="help">指南</button><button id="fullscreen" aria-label="切换全屏">⛶</button></div>
<div id="hint" hidden></div><div id="metrics" hidden></div>
<div id="touch" hidden><button data-key="KeyW">↑</button><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div>
<dialog id="guide"><header><h2>在家里走走</h2><button class="close" data-close aria-label="关闭指南">×</button></header><div class="row"><span>行走 · 快步</span><span>WASD · Shift</span></div><div class="row"><span>环视</span><span>鼠标 · 按住左键拖动</span></div><div class="row"><span>跳跃 · 手灯</span><span>空格 · F</span></div><div class="row"><span>全景 · 回到门前</span><span>Tab · R</span></div><div class="row"><span>释放鼠标</span><span>Esc</span></div><div class="row"><label for="quality">画面清晰度</label><select id="quality" class="quality"><option value="high">高清</option><option value="balanced" selected>均衡</option><option value="light">流畅</option></select></div><p>从前门进入，沿中间的木楼梯上楼。每一层的走廊连接两侧房间；后院有菜园、果树和亚瑟的杂物棚。</p><p>五层布局、房间分配与庭院设计为本次创作。原著细节包括歪斜家屋、家人方位钟、红屋顶与阁楼。</p><button data-close class="primary wide">继续探索</button></dialog>
<dialog id="destinations"><header><h2>想去哪里</h2><button class="close" data-close aria-label="关闭地点选择">×</button></header><div class="places"><button data-place="1"><small>01 / 前院</small>门前</button><button data-place="2"><small>02 / 一层</small>厨房与餐桌</button><button data-place="3"><small>03 / 一层</small>起居室</button><button data-place="5"><small>04 / 顶层</small>罗恩的房间</button><button data-place="4"><small>05 / 院外</small>后院</button><button data-place="6"><small>06 / 后院</small>亚瑟的杂物棚</button></div><p>也可以沿楼梯和院中小路，自由步行到达这些地方。</p></dialog>
<noscript>启用 JavaScript 后即可探索陋居。</noscript><script src="game.js"></script><script>
const config={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":13487244,"game.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};config.canvasResizePolicy=0;
const canvas=document.querySelector('#canvas');let quality='balanced';
function sizeCanvas(){const cap=quality==='high'?1920:quality==='light'?960:1440;const scale=Math.min(devicePixelRatio,cap/innerWidth,quality==='high'?1200/innerHeight:900/innerHeight);canvas.width=Math.round(innerWidth*scale);canvas.height=Math.round(innerHeight*scale)}sizeCanvas();addEventListener('resize',sizeCanvas);
const engine=new Engine(config);const q=s=>document.querySelector(s);window.hearthErrors=[];window.hearthPaused=false;let serial=0,running=false;
function send(action,extra={}){window.hearthCommand={serial:++serial,action,...extra};canvas.focus()}
window.hearthSend=send;const originalFetch=fetch.bind(window);
async function transport(){const mf=await originalFetch('./packed-files.json');if(!mf.ok)throw Error('场景清单无法读取');const manifest=await mf.json();window.fetch=async(input,init)=>{const url=new URL(typeof input==='string'?input:input.url,location.href);const asset=url.origin===location.origin&&manifest[url.pathname.split('/').pop()];if(!asset)return originalFetch(input,init);const response=await originalFetch(new URL(asset.file,url),init);if(!response.ok)throw Error('场景加载失败');return new Response(response.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':asset.mime,'Content-Length':String(asset.size)}})}}
async function begin(){if(running)return;running=true;q('#start').disabled=true;q('#start').textContent='正在打开…';q('#progress').hidden=false;try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw Error(missing.join(', '));await transport();await engine.startGame({onProgress(current,total){if(total>0){q('#progress').value=current/total*100;q('#status').textContent=current<total?'正在加载 · '+Math.round(current/total*100)+'%':'正在点亮屋里的灯…'}},onPrintError(...m){hearthErrors.push(m.join(' '));console.error(...m)}});let start=performance.now();await new Promise((res,rej)=>{const timer=setInterval(()=>{if(window.hearthState?.ready){clearInterval(timer);res()}else if(performance.now()-start>90000){clearInterval(timer);rej(Error('场景初始化超时'))}},100)});q('#loading').remove();q('#hud').hidden=false;q('#toolbar').hidden=false;q('#touch').hidden=false;canvas.focus()}catch(e){hearthErrors.push(String(e));q('#status').textContent='打开失败：'+e.message;q('#start').textContent='刷新重试';q('#start').disabled=false;q('#start').onclick=()=>location.reload()}}
q('#start').onclick=begin;q('#tour-entry').onclick=()=>send('walk');q('#overview').onclick=()=>send('overview');
function show(d){window.hearthPaused=true;if(document.pointerLockElement)document.exitPointerLock();d.showModal()}
q('#help').onclick=()=>show(q('#guide'));q('#places').onclick=()=>show(q('#destinations'));
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>b.closest('dialog').close();
for(const d of document.querySelectorAll('dialog'))d.addEventListener('close',()=>{window.hearthPaused=false;canvas.focus()});
for(const b of document.querySelectorAll('[data-place]'))b.onclick=()=>{b.closest('dialog').close();send('bookmark',{index:Number(b.dataset.place)})};
q('#quality').onchange=e=>{quality=e.target.value;sizeCanvas();send('quality',{value:quality==='light'?0:1})};q('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}canvas.focus()};
let hintTimer;function hint(text){q('#hint').textContent=text;q('#hint').hidden=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>q('#hint').hidden=true,5500)}
document.addEventListener('pointerlockerror',()=>hint('按住鼠标左键拖动，也可以环视四周'));
let lastmode;setInterval(()=>{const s=window.hearthState;if(!s?.ready)return;q('#location').textContent=s.location;q('#dot').hidden=s.overview;q('#tour-entry').hidden=!s.overview;if(lastmode!==s.overview){lastmode=s.overview;q('#controls').innerHTML=s.overview?'<span>拖动环视</span><span class="secondary">滚轮远近</span>':'<span><kbd>WASD</kbd> 行走</span><span class="secondary"><kbd>鼠标</kbd> 环视</span>'}if(new URLSearchParams(location.search).has('metrics')){q('#metrics').hidden=false;q('#metrics').textContent=`${s.fps} FPS · ${s.draw_calls} draws · ${Math.round(s.primitives/1000)}k triangles`}},160);
for(const b of document.querySelectorAll('[data-key]')){for(const type of ['pointerdown','pointerup','pointercancel'])b.addEventListener(type,e=>{e.preventDefault();canvas.dispatchEvent(new KeyboardEvent(type==='pointerdown'?'keydown':'keyup',{code:b.dataset.key,key:b.dataset.key.slice(-1).toLowerCase(),bubbles:true}));if(type==='pointerdown')b.setPointerCapture(e.pointerId)})}
</script></body></html>
